name: Build and Deploy Agents API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: kingbrady/custom-agents-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "VERSION=$(cat api/VERSION)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Custom Agents API
        uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update custom agents API deployment image tag
        run: |
          sed -i "s|image: kingbrady/custom-agents-api:.*|image: kingbrady/custom-agents-api:${{ steps.version.outputs.VERSION }}|" kube/api/deployment.yaml

      - name: Commit deployment version updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kube/api/deployment.yaml
          git diff --cached --quiet || git commit -m "chore: update deployment images to v${{ steps.version.outputs.VERSION }} [skip ci]"
          git push

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kube/api/deployment.yaml -n agents
          kubectl rollout status deployment/api -n agents --timeout=300s

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f ~/.kube/config
